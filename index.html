<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daggerheart Character Sheet</title>
    <script>
      // Set the theme before first paint so dark mode never flashes white. Mirrors resolveTheme in src/state/theme.ts.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("dh:ui:theme");
        } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
